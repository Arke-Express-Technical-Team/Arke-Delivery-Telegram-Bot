# Apply labels to pull requests without executing code from the PR branch.
# pull_request_target uses the base branch's workflow and configuration.
name: Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write # Allows labeler to create labels if they do not already exist.
    steps:
      - name: Label pull request
        uses: actions/labeler@v7
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
